name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser and media test dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run unit and integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate content
        run: python3 test_content.py
      - name: Build static artifact
        run: npm run build
      - name: Verify Worker bundle
        run: npm run build:worker
