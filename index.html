<!DOCTYPE html>

<html data-site-attrs='{"lang": "meta.language"}'>

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="light" name="color-scheme" />
    <title data-site-text="meta.title"></title>
    <link href="style.css" rel="stylesheet" />
    <link href="auth.css" rel="stylesheet" />
    <link href="editor-preview.css" rel="stylesheet" />
</head>

<body>
    <!-- 可复用内联图标，不依赖第三方资源。 -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <symbol id="arrow" viewbox="0 0 24 24">
                <path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="1.5"></path>
            </symbol>
            <symbol id="chevron" viewbox="0 0 24 24">
                <path d="m8 5 7 7-7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="1.5"></path>
            </symbol>
            <symbol id="image" viewbox="0 0 40 40">
                <rect fill="none" height="26" rx="2" stroke="currentColor" width="30" x="5" y="7"></rect>
                <circle cx="14" cy="15" fill="none" r="3" stroke="currentColor"></circle>
                <path d="m7 30 9-10 6 6 6-8 5 6" fill="none" stroke="currentColor" stroke-linejoin="round"></path>
            </symbol>
            <symbol id="play" viewbox="0 0 20 20">
                <path d="m6 3 11 7-11 7z" fill="currentColor"></path>
            </symbol>
            <symbol id="close" viewbox="0 0 24 24">
                <path d="m6 6 12 12M6 18 18 6" fill="none" stroke="currentColor" stroke-linecap="round"
                    stroke-width="1.5"></path>
            </symbol>
            <symbol id="menu" viewbox="0 0 24 24">
                <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.5"></path>
            </symbol>
        </defs>
    </svg>
    <a class="skip" data-site-attrs='{"href": "header.skipHref"}' data-site-text="header.skipLabel"></a>
    <header class="site-header">
        <nav class="nav wrap" data-site-attrs='{"aria-label": "header.ariaLabel"}'>
            <a class="wordmark" data-site-attrs='{"href": "header.brandHref", "aria-label": "header.brandAriaLabel"}'
                data-site-text="header.brand"><span aria-hidden="true" class="wordmark-mark"></span></a>
            <button aria-controls="nav-links" aria-expanded="false" class="menu-toggle"
                data-site-attrs='{"aria-label": "header.menu.openLabel"}'><svg aria-hidden="true">
                    <use href="#menu"></use>
                </svg></button>
            <div class="nav-links" id="nav-links">
                <a data-site-attrs='{"href": "header.links.0.href"}' data-site-text="header.links.0.label"></a><a
                    data-site-attrs='{"href": "header.links.1.href"}' data-site-text="header.links.1.label"></a><a
                    data-site-attrs='{"href": "header.links.2.href"}' data-site-text="header.links.2.label"></a><a
                    class="pill pill-gold" data-site-attrs='{"href": "header.links.3.href"}'
                    data-site-text="header.links.3.label"></a>
            </div>
        </nav>
    </header>
    <main id="main">
        <!-- 01 / 首页 Hero + 描述 -->
        <section aria-labelledby="hero-title" class="hero" id="home">
            <div aria-hidden="true" class="hero-image"><img class="sample-photo" data-site-image="sections.hero.image"
                    decoding="async" height="1000" referrerpolicy="no-referrer" width="1800" /><span
                    class="hero-placeholder" data-site-text="sections.hero.image.placeholder"
                    data-site-text-position="after"><svg>
                        <use href="#image"></use>
                    </svg></span></div>
            <div class="hero-content wrap">
                <p class="eyebrow" data-site-text="sections.hero.eyebrow"></p>
                <h1 data-site-lines="sections.hero.title" id="hero-title"></h1>
                <p data-site-lines="sections.hero.description"></p>
                <div class="hero-bottom">
                    <a class="pill pill-gold" data-site-attrs='{"href": "sections.hero.action.href"}'
                        data-site-text="sections.hero.action.label"><svg aria-hidden="true">
                            <use href="#arrow"></use>
                        </svg></a>
                    <span class="hero-caption" data-site-text="sections.hero.caption"></span>
                </div>
            </div>
        </section>
        <section aria-labelledby="intro-title" class="intro">
            <div aria-hidden="true" class="intro-backdrop"><img class="sample-photo"
                    data-site-image="sections.intro.backgroundImage" decoding="async" height="900"
                    referrerpolicy="no-referrer" width="1600" /></div>
            <div class="intro-grid wrap">
                <div aria-hidden="true" class="intro-art">
                    <div class="intro-coin"><img class="sample-photo" data-site-image="sections.intro.image"
                            decoding="async" height="900" referrerpolicy="no-referrer" width="900" /><span
                            class="coin-label" data-site-text="sections.intro.image.placeholder"></span></div>
                </div>
                <div class="intro-text">
                    <div class="intro-title"><span class="section-index" data-site-text="sections.intro.index"></span>
                        <h2 data-site-lines="sections.intro.title" id="intro-title"></h2>
                    </div>
                    <div class="intro-copy">
                        <p data-site-text="sections.intro.description"></p><a class="text-link"
                            data-site-attrs='{"href": "sections.intro.action.href"}'
                            data-site-text="sections.intro.action.label"><svg aria-hidden="true">
                                <use href="#arrow"></use>
                            </svg></a>
                    </div>
                </div>
            </div>
        </section>
        <section aria-labelledby="layouts-title" class="layout-section" id="layouts">
            <div aria-hidden="true" class="layout-backdrop"><img id="moment-background" alt="" /></div>
            <div class="wrap">
                <p class="eyebrow" data-site-text="sections.layouts.eyebrow"></p>
                <h2 data-site-text="sections.layouts.title" id="layouts-title"></h2>
                <p id="moments-empty" class="video-empty">No videos yet.</p>
                <div id="moments-content" class="feature-grid" hidden>
                    <article><a id="moment-cover-link" class="media feature-media"><img id="moment-cover" class="sample-photo" alt="" /><span class="play" aria-hidden="true">▶</span></a></article>
                    <div class="feature-copy">
                        <p class="eyebrow">ORAL HISTORY ARCHIVE</p><h3 id="moment-title"></h3>
                        <ul id="moment-tags" class="video-tags" aria-label="Video tags"></ul>
                        <a id="moment-link" class="pill pill-light">Take a look →</a>
                        <button id="moment-next" class="compact-card" type="button"><span class="media compact-media"><img id="moment-next-cover" class="sample-photo" alt="" /></span><span class="compact-copy"><span class="eyebrow">NEXT VIDEO →</span><strong id="moment-next-title"></strong></span></button>
                        <div class="moment-controls"><span id="moment-position" aria-live="off"></span><button id="moment-pause" type="button" aria-pressed="false">Pause rotation</button></div>
                    </div>
                </div>
            </div>
        </section>
        <section aria-labelledby="videos-title" class="rail-section" id="videos"><div class="wrap">
            <div class="section-head"><div><p class="eyebrow" data-site-text="sections.videos.eyebrow"></p><h2 data-site-text="sections.videos.title" id="videos-title"></h2></div></div>
            <p id="videos-empty" class="video-empty">No videos yet.</p>
            <div id="archive-stage" class="rail-stage" hidden><button id="previous" class="rail-arrow" type="button" aria-label="Previous videos">‹</button><button id="next" class="rail-arrow" type="button" aria-label="Next videos">›</button><div class="rail" id="video-rail" tabindex="0" aria-label="Video archive"></div></div>
        </div></section>
        <!-- 04 / 致谢文字页 -->
        <section aria-labelledby="thanks-title" class="thanks" id="thanks">
            <div class="wrap">
                <p class="eyebrow" data-site-text="sections.thanks.eyebrow"></p>
                <h2 data-site-text="sections.thanks.title" id="thanks-title"></h2>
                <p class="thanks-copy" data-site-text="sections.thanks.description"></p>
                <a class="pill pill-light" data-site-attrs='{"href": "sections.thanks.action.href"}'
                    data-site-text="sections.thanks.action.label"><svg aria-hidden="true"
                        style="transform:rotate(-90deg)">
                        <use href="#arrow"></use>
                    </svg></a>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-inner wrap"><a class="wordmark" data-site-attrs='{"href": "footer.brandHref"}'
                data-site-text="footer.brand"><span aria-hidden="true" class="wordmark-mark"></span></a>
            <p data-site-text="footer.description"></p><a class="text-link" data-site-attrs='{"href": "footer.topHref"}'
                data-site-text="footer.topLabel"></a>
        </div>
    </footer>
    <script src="response-utils.js"></script>
    <script src="script.js"></script>
    <script src="config.js"></script>
    <script src="content-policy.js"></script>
    <script src="auth.js"></script>
    <script src="editor-preview.js"></script>
</body>

</html>
