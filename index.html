<!DOCTYPE html>

<html data-site-attrs='{"lang": "meta.language"}'>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="light" name="color-scheme"/>
<title data-site-text="meta.title"></title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<!-- 可复用内联图标，不依赖第三方资源。 -->
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<defs>
<symbol id="arrow" viewbox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></symbol>
<symbol id="chevron" viewbox="0 0 24 24"><path d="m8 5 7 7-7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></symbol>
<symbol id="image" viewbox="0 0 40 40"><rect fill="none" height="26" rx="2" stroke="currentColor" width="30" x="5" y="7"></rect><circle cx="14" cy="15" fill="none" r="3" stroke="currentColor"></circle><path d="m7 30 9-10 6 6 6-8 5 6" fill="none" stroke="currentColor" stroke-linejoin="round"></path></symbol>
<symbol id="play" viewbox="0 0 20 20"><path d="m6 3 11 7-11 7z" fill="currentColor"></path></symbol>
<symbol id="close" viewbox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path></symbol>
<symbol id="menu" viewbox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.5"></path></symbol>
</defs>
</svg>
<a class="skip" data-site-attrs='{"href": "header.skipHref"}' data-site-text="header.skipLabel"></a>
<header class="site-header">
<nav class="nav wrap" data-site-attrs='{"aria-label": "header.ariaLabel"}'>
<a class="wordmark" data-site-attrs='{"href": "header.brandHref", "aria-label": "header.brandAriaLabel"}' data-site-text="header.brand"><span aria-hidden="true" class="wordmark-mark"></span></a>
<button aria-controls="nav-links" aria-expanded="false" class="menu-toggle" data-site-attrs='{"aria-label": "header.menu.openLabel"}'><svg aria-hidden="true"><use href="#menu"></use></svg></button>
<div class="nav-links" id="nav-links">
<a data-site-attrs='{"href": "header.links.0.href"}' data-site-text="header.links.0.label"></a><a data-site-attrs='{"href": "header.links.1.href"}' data-site-text="header.links.1.label"></a><a data-site-attrs='{"href": "header.links.2.href"}' data-site-text="header.links.2.label"></a><a class="pill pill-gold" data-site-attrs='{"href": "header.links.3.href"}' data-site-text="header.links.3.label"></a>
</div>
</nav>
</header>
<main id="main">
<!-- 01 / 首页 Hero + 描述 -->
<section aria-labelledby="hero-title" class="hero" id="home">
<div aria-hidden="true" class="hero-image"><img class="sample-photo" data-site-image="sections.hero.image" decoding="async" height="1000" referrerpolicy="no-referrer" width="1800"/><span class="hero-placeholder" data-site-text="sections.hero.image.placeholder" data-site-text-position="after"><svg><use href="#image"></use></svg></span></div>
<div class="hero-content wrap">
<p class="eyebrow" data-site-text="sections.hero.eyebrow"></p>
<h1 data-site-lines="sections.hero.title" id="hero-title"></h1>
<p data-site-lines="sections.hero.description"></p>
<div class="hero-bottom">
<a class="pill pill-gold" data-site-attrs='{"href": "sections.hero.action.href"}' data-site-text="sections.hero.action.label"><svg aria-hidden="true"><use href="#arrow"></use></svg></a>
<span class="hero-caption" data-site-text="sections.hero.caption"></span>
</div>
</div>
</section>
<section aria-labelledby="intro-title" class="intro">
<div aria-hidden="true" class="intro-backdrop"><img class="sample-photo" data-site-image="sections.intro.backgroundImage" decoding="async" height="900" referrerpolicy="no-referrer" width="1600"/></div>
<div class="intro-grid wrap">
<div aria-hidden="true" class="intro-art"><div class="intro-coin"><img class="sample-photo" data-site-image="sections.intro.image" decoding="async" height="900" referrerpolicy="no-referrer" width="900"/><span class="coin-label" data-site-text="sections.intro.image.placeholder"></span></div></div>
<div class="intro-text">
<div class="intro-title"><span class="section-index" data-site-text="sections.intro.index"></span><h2 data-site-lines="sections.intro.title" id="intro-title"></h2></div>
<div class="intro-copy"><p data-site-text="sections.intro.description"></p><a class="text-link" data-site-attrs='{"href": "sections.intro.action.href"}' data-site-text="sections.intro.action.label"><svg aria-hidden="true"><use href="#arrow"></use></svg></a></div>
</div>
</div>
</section>
<!-- 02 / 主次双列 + 描边横排卡片 -->
<section aria-labelledby="layouts-title" class="layout-section" id="layouts">
<div aria-hidden="true" class="layout-backdrop"><img data-site-image="sections.layouts.backgroundImage" data-site-image-fallback="sections.layouts.mainCard.image" decoding="async" height="675" id="layout-background-photo" referrerpolicy="no-referrer" width="900"/></div>
<div class="wrap">
<p class="eyebrow" data-site-text="sections.layouts.eyebrow"></p><h2 data-site-text="sections.layouts.title" id="layouts-title"></h2>
<div class="feature-grid">
<article><button class="media feature-media" data-site-attrs='{"aria-label": "sections.layouts.mainCard.openLabel", "data-video": "sections.layouts.mainCard.videoId"}' data-site-card="sections.layouts.mainCard"><img class="sample-photo" data-site-image="sections.layouts.mainCard.image" decoding="async" height="675" referrerpolicy="no-referrer" width="900"/><span class="media-num" data-site-text="sections.layouts.mainCard.number"></span><span class="image-label" data-site-text="sections.layouts.mainCard.image.placeholder" data-site-text-position="after"><svg aria-hidden="true"><use href="#image"></use></svg></span><span class="play"><svg aria-hidden="true"><use href="#play"></use></svg></span><span class="duration" data-site-text="sections.layouts.mainCard.duration"></span></button><div class="feature-caption"><h3 data-site-text="sections.layouts.mainCard.title"></h3><span data-site-text="sections.layouts.mainCard.caption"></span></div></article>
<div class="feature-copy">
<p class="eyebrow" data-site-text="sections.layouts.copy.eyebrow"></p><h3 data-site-lines="sections.layouts.copy.title"></h3><p data-site-text="sections.layouts.copy.description"></p><button class="pill pill-light" data-site-attrs='{"data-video": "sections.layouts.mainCard.videoId"}' data-site-card="sections.layouts.mainCard" data-site-text="sections.layouts.copy.action.label"><svg aria-hidden="true"><use href="#arrow"></use></svg></button>
<article class="compact-card"><button class="media compact-media" data-site-attrs='{"aria-label": "sections.layouts.sideCard.openLabel", "data-video": "sections.layouts.sideCard.videoId"}' data-site-card="sections.layouts.sideCard"><img class="sample-photo" data-site-image="sections.layouts.sideCard.image" decoding="async" height="675" referrerpolicy="no-referrer" width="900"/><span class="image-label" data-site-text="sections.layouts.sideCard.image.placeholder" data-site-text-position="after"><svg aria-hidden="true"><use href="#image"></use></svg></span><span class="play"><svg aria-hidden="true"><use href="#play"></use></svg></span></button><div class="compact-copy"><p class="eyebrow" data-site-text="sections.layouts.sideCard.eyebrow"></p><h3 data-site-text="sections.layouts.sideCard.title"></h3><p data-site-text="sections.layouts.sideCard.description"></p></div></article>
</div>
</div>
</div>
</section>
<!-- 03 / 三张开放式卡片；原生横向滚动 -->
<section aria-labelledby="videos-title" class="rail-section" id="videos">
<div class="wrap">
<div class="section-head">
<div><p class="eyebrow" data-site-text="sections.videos.eyebrow"></p><h2 data-site-text="sections.videos.title" id="videos-title"></h2></div>
</div>
<div class="rail-stage">
<button aria-controls="video-rail" class="rail-arrow" data-site-attrs='{"aria-label": "sections.videos.controls.previousLabel"}' disabled="" id="previous"><svg aria-hidden="true" style="transform:rotate(180deg)"><use href="#chevron"></use></svg></button>
<button aria-controls="video-rail" class="rail-arrow" data-site-attrs='{"aria-label": "sections.videos.controls.nextLabel"}' id="next"><svg aria-hidden="true"><use href="#chevron"></use></svg></button>
<div class="rail" data-site-attrs='{"aria-label": "sections.videos.controls.listLabel"}' id="video-rail" tabindex="0">



<template data-site-each="sections.videos.cards"><article class="rail-card">
<button class="media" data-site-attrs='{"aria-label": "sections.videos.cards.0.openLabel", "data-video": "sections.videos.cards.0.videoId"}' data-site-card="sections.videos.cards.0"><img class="sample-photo" data-site-image="sections.videos.cards.0.image" decoding="async" height="560" referrerpolicy="no-referrer" width="900"/><span class="media-num" data-site-text="sections.videos.cards.0.number"></span><span class="image-label" data-site-text="sections.videos.cards.0.image.placeholder" data-site-text-position="after"><svg aria-hidden="true"><use href="#image"></use></svg></span><span class="play"><svg aria-hidden="true"><use href="#play"></use></svg></span><span class="duration" data-site-text="sections.videos.cards.0.duration"></span></button>
<div class="card-meta"><h3 data-site-text="sections.videos.cards.0.title"></h3><span data-site-text="sections.videos.cards.0.caption"></span></div><p data-site-text="sections.videos.cards.0.description"></p>
</article></template></div>
</div>
<div class="rail-footer"><div aria-hidden="true" class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div></div>
</div>
</section>
<!-- 04 / 致谢文字页 -->
<section aria-labelledby="thanks-title" class="thanks" id="thanks">
<div class="wrap"><p class="eyebrow" data-site-text="sections.thanks.eyebrow"></p><h2 data-site-text="sections.thanks.title" id="thanks-title"></h2><ul class="credits" data-site-attrs='{"aria-label": "sections.thanks.ariaLabel"}'>
<li data-site-text="sections.thanks.names.0" style="--x:10%;--y:12%;--size:16px;--tone:0.78;--mx:21%;--my:7%;--msize:13px"></li>
<li data-site-text="sections.thanks.names.1" style="--x:47%;--y:8%;--size:20px;--tone:0.85;--mx:73%;--my:12%;--msize:15px"></li>
<li data-site-text="sections.thanks.names.2" style="--x:84%;--y:15%;--size:15px;--tone:0.68;--mx:28%;--my:24%;--msize:14px"></li>
<li data-site-text="sections.thanks.names.3" style="--x:28%;--y:34%;--size:22px;--tone:0.92;--mx:77%;--my:29%;--msize:13px"></li>
<li data-site-text="sections.thanks.names.4" style="--x:68%;--y:30%;--size:18px;--tone:0.82;--mx:20%;--my:40%;--msize:15px"></li>
<li data-site-text="sections.thanks.names.5" style="--x:10%;--y:54%;--size:19px;--tone:0.86;--mx:72%;--my:44%;--msize:14px"></li>
<li data-site-text="sections.thanks.names.6" style="--x:48%;--y:54%;--size:21px;--tone:0.9;--mx:29%;--my:56%;--msize:16px"></li>
<li data-site-text="sections.thanks.names.7" style="--x:88%;--y:50%;--size:17px;--tone:0.72;--mx:80%;--my:59%;--msize:12px"></li>
<li data-site-text="sections.thanks.names.8" style="--x:69%;--y:75%;--size:20px;--tone:0.88;--mx:20%;--my:73%;--msize:14px"></li>
<li data-site-text="sections.thanks.names.9" style="--x:20%;--y:87%;--size:17px;--tone:0.75;--mx:72%;--my:77%;--msize:15px"></li>
<li data-site-text="sections.thanks.names.10" style="--x:48%;--y:92%;--size:14px;--tone:0.7;--mx:28%;--my:89%;--msize:12px"></li>
<li data-site-text="sections.thanks.names.11" style="--x:87%;--y:87%;--size:19px;--tone:0.83;--mx:78%;--my:94%;--msize:14px"></li>
</ul><a class="pill pill-light" data-site-attrs='{"href": "sections.thanks.action.href"}' data-site-text="sections.thanks.action.label"><svg aria-hidden="true" style="transform:rotate(-90deg)"><use href="#arrow"></use></svg></a></div>
</section>
</main>
<footer class="site-footer"><div class="footer-inner wrap"><a class="wordmark" data-site-attrs='{"href": "footer.brandHref"}' data-site-text="footer.brand"><span aria-hidden="true" class="wordmark-mark"></span></a><p data-site-text="footer.description"></p><a class="text-link" data-site-attrs='{"href": "footer.topHref"}' data-site-text="footer.topLabel"></a></div></footer>
<dialog aria-describedby="dialog-description" aria-labelledby="dialog-title" id="video-dialog">
<div class="dialog-head"><h3 data-site-text="videoDialog.initialTitle" id="dialog-title"></h3><button autofocus="" class="icon-button dialog-close" data-site-attrs='{"aria-label": "videoDialog.closeLabel"}'><svg aria-hidden="true"><use href="#close"></use></svg></button></div>
<div class="video-placeholder"><svg aria-hidden="true"><use href="#play"></use></svg><p data-site-text="videoDialog.initialLabel" id="preview-label"></p><span data-site-text="videoDialog.placeholder"></span></div><p class="dialog-foot" data-site-text="videoDialog.description" id="dialog-description"></p>
</dialog>
<script src="script.js"></script>
</body>
</html>
